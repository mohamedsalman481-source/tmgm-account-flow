<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TMGM · Account Opening Flow</title>
<meta name="description" content="Interactive bilingual (English / Arabic) guide: how to open a TMGM live account in 5 stages and 11 steps.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1f6b; --navy-2:#0a1750; --blue:#1d4ed8; --blue-soft:#e8eefc;
  --orange:#ff7a1a; --orange-soft:#fff1e6; --green:#12a36b; --green-soft:#e3f6ee;
  --bg:#f4f7ff; --card:#ffffff; --ink:#0d1b4c; --muted:#5b6692; --line:#dde4f5;
  --radius:18px; --shadow:0 10px 30px rgba(11,31,107,.08);
  --font-en:'IBM Plex Sans',system-ui,sans-serif; --font-head:'Lexend','IBM Plex Sans Arabic',sans-serif;
}
:root[data-theme="dark"]{
  --bg:#070d2b; --card:#101a4a; --ink:#eef2ff; --muted:#a4b0e0; --line:#243273;
  --blue-soft:#16246b; --orange-soft:#3a2312; --green-soft:#0f3a2c; --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{background:var(--bg);color:var(--ink);font-family:var(--font-en);line-height:1.6;-webkit-font-smoothing:antialiased}
[dir="rtl"] body, [dir="rtl"]{font-family:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif}
h1,h2,h3{font-family:var(--font-head);line-height:1.25}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3{font-family:'IBM Plex Sans Arabic',var(--font-head);font-weight:700}
a{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}

/* top bar */
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.brand{font-family:var(--font-head);font-weight:700;letter-spacing:.04em;display:flex;flex-direction:column;line-height:1.1}
.brand small{font-size:9px;letter-spacing:.28em;color:var(--muted);font-weight:500}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--blue-soft);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;box-shadow:0 4px 12px rgba(11,31,107,.3)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--blue)}
.icon-btn{border:1px solid var(--line);background:var(--card);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:16px}
.progress-mini{height:3px;background:var(--line)}
.progress-mini i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--orange));transition:width .3s}

/* hero */
.hero{background:linear-gradient(135deg,var(--navy-2),var(--navy) 55%,#1646c9);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px}
.hero-in{position:relative;max-width:1200px;margin:0 auto;padding:56px 20px 64px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(32px,5vw,56px);margin-bottom:14px}
.hero p.lead{font-size:18px;color:#c9d4ff;max-width:46ch;margin-bottom:22px}
.pills{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.pill{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 16px;font-size:14px;color:#e6ecff}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 24px;font-weight:600;background:var(--orange);color:#fff;text-decoration:none;box-shadow:0 8px 20px rgba(255,122,26,.35);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);box-shadow:none}
.hero-card{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:var(--radius);padding:22px;backdrop-filter:blur(4px)}
.hero-card h3{font-size:15px;margin-bottom:12px;color:#ffd7b8;font-weight:600}
.ready{list-style:none;display:grid;gap:10px}
.ready li{display:flex;gap:10px;align-items:center;font-size:15px}
.ready li::before{content:"✓";color:#5eead4;font-weight:700}

/* layout */
.wrap{max-width:1200px;margin:0 auto;padding:36px 20px 80px;display:grid;grid-template-columns:270px 1fr;gap:36px}
.rail{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 110px);overflow:auto;padding-inline-end:4px}
.rail h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
[dir="rtl"] .rail h4{letter-spacing:0}
.stage-group{margin-bottom:14px}
.stage-label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-bottom:4px}
.stage-label b{width:22px;height:22px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:12px}
.rail a.step-link{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;text-decoration:none;font-size:14px;color:var(--muted);border-inline-start:3px solid transparent}
.rail a.step-link:hover{background:var(--blue-soft)}
.rail a.step-link.active{background:var(--blue-soft);color:var(--ink);border-inline-start-color:var(--orange);font-weight:600}
.rail a.step-link.done .num{background:var(--green);color:#fff}
.num{min-width:22px;height:22px;border-radius:7px;background:var(--line);display:grid;place-items:center;font-size:12px;font-weight:600}

/* overview */
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:40px}
.stage-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-decoration:none;display:block;transition:transform .15s,border-color .15s}
.stage-card:hover{transform:translateY(-3px);border-color:var(--blue)}
.stage-card .n{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:10px}
.stage-card h3{font-size:15px;margin-bottom:4px}
.stage-card p{font-size:13px;color:var(--muted)}
.stage-card .rng{display:inline-block;margin-top:8px;font-size:12px;color:var(--orange);font-weight:600}

.stage-head{display:flex;align-items:center;gap:12px;margin:48px 0 18px}
.stage-head .n{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700}
.stage-head h2{font-size:22px}
.stage-head .line{flex:1;height:1px;background:var(--line)}

/* step card */
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:22px;scroll-margin-top:90px;transition:border-color .2s,box-shadow .2s}
.step:target,.step.focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,122,26,.18),var(--shadow)}
.step-top{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.badge{background:var(--navy);color:#fff;border-radius:14px;padding:6px 14px;text-align:center;line-height:1.1;min-width:58px}
.badge small{display:block;font-size:10px;opacity:.75;letter-spacing:.08em;text-transform:uppercase}
.badge b{font-size:24px;font-family:var(--font-head)}
.step-top h3{font-size:21px;flex:1}
.done-btn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.done-btn[aria-pressed="true"]{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.step-body{display:grid;grid-template-columns:1fr 1.15fr;gap:26px;align-items:start}
.points{list-style:none;display:grid;gap:12px;counter-reset:p}
.points li{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;border:1px solid transparent;cursor:default;transition:background .15s,border-color .15s}
.points li:hover,.points li.hl{background:var(--orange-soft);border-color:#ffd2ad}
.dot{min-width:26px;height:26px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:1px}
.note{margin-top:16px;border-radius:12px;padding:12px 16px;font-size:14.5px;border-inline-start:4px solid var(--blue);background:var(--blue-soft)}
.note.tip{border-color:var(--green);background:var(--green-soft)}
.note.warn{border-color:var(--orange);background:var(--orange-soft)}
.note b{display:block;margin-bottom:2px}

/* mock browser */
.mock{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;color:#0d1b4c;direction:ltr;text-align:left;font-family:'IBM Plex Sans',sans-serif;box-shadow:0 6px 20px rgba(11,31,107,.1)}
.mock-bar{background:#eef2fb;padding:8px 12px;display:flex;gap:10px;align-items:center}
.mock-bar i{width:9px;height:9px;border-radius:50%;background:#c9d2ea;display:inline-block;margin-right:3px}
.mock-bar span{background:#fff;border-radius:6px;padding:2px 14px;font-size:11px;color:#5b6692}
.mock-body{padding:18px;position:relative;font-size:12px}
.mock h5{font-size:15px;text-align:center;margin-bottom:12px;font-family:'Lexend',sans-serif}
.fld{border:1px solid #dde4f5;border-radius:6px;padding:8px 10px;color:#5b6692;font-size:11.5px;background:#fff}
.fld.filled{background:#eef0f4;filter:blur(0);color:transparent;position:relative}
.fld.filled::after{content:"";position:absolute;left:10px;top:50%;width:46%;height:8px;border-radius:4px;background:#cfd5e3;transform:translateY(-50%)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.cta{background:linear-gradient(90deg,#0b1f6b,#1d6ae8);color:#fff;border-radius:999px;text-align:center;padding:9px;font-weight:600;font-size:12px;margin-top:10px}
.cta.orange{background:var(--orange)}
.cta.light{background:#7aa2ff}
.hs{position:relative;outline:2px solid var(--orange);outline-offset:3px;border-radius:8px;transition:box-shadow .15s,outline-width .15s}
.hs.hl{box-shadow:0 0 0 6px rgba(255,122,26,.3);outline-width:3px}
.hs>.tag{position:absolute;top:-11px;inset-inline-end:-8px;inset-inline-end:auto;right:-8px;background:var(--orange);color:#fff;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;z-index:2}
.banner{background:#ffe3cc;color:#c2560a;padding:7px 12px;font-size:11px;display:flex;justify-content:space-between;align-items:center;margin:-18px -18px 14px}
.banner .ob{background:var(--orange);color:#fff;border-radius:999px;padding:3px 12px;font-weight:600}
.trackbar{display:flex;justify-content:space-between;font-size:10px;color:#5b6692;margin:14px 0;position:relative}
.trackbar span{position:relative;padding-top:14px;text-align:center;flex:1}
.trackbar span::before{content:"";position:absolute;top:0;left:50%;width:9px;height:9px;border-radius:50%;background:#cfd8ee;transform:translateX(-50%)}
.trackbar span.on::before{background:var(--blue)}
.trackbar span.on{color:var(--blue);font-weight:600}
.opt{display:flex;justify-content:space-between;border:1px solid #dde4f5;border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:11.5px}
.opt::after{content:"";width:12px;height:12px;border-radius:50%;border:1.5px solid #9aa6cf}
.opt.sel{border-color:#1d6ae8;color:#1d6ae8;background:#f0f5ff}
.opt.sel::after{background:#1d6ae8;border-color:#1d6ae8;box-shadow:inset 0 0 0 2px #fff}
.upl{display:flex;gap:10px;align-items:center;border:1px solid #dde4f5;border-radius:8px;padding:8px;margin-bottom:6px}
.upl i{width:34px;height:34px;border-radius:6px;background:linear-gradient(135deg,#d6d0c8,#b9b0a2);display:block}
.upl em{font-style:normal;font-size:10px;color:#12a36b;display:block}
.chk{display:flex;gap:6px;align-items:center;font-size:10.5px;margin:3px 0;color:#12a36b}
.chk.bad{color:#d33}
.face{width:74px;height:74px;border-radius:50%;margin:4px auto 8px;border:3px dotted #7aa2ff;display:grid;place-items:center;font-size:34px;background:#eaf1ff}
.congrats{text-align:center;padding:10px 0}
.congrats .gem{font-size:46px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.btn-o{border:1px solid #1d6ae8;color:#1d6ae8;border-radius:6px;padding:8px;text-align:center;font-weight:600;font-size:11.5px}
.btn-f{background:#1d6ae8;color:#fff;border-radius:6px;padding:8px;text-align:center;font-weight:600;font-size:11.5px}
.summary{position:absolute;top:18px;right:14px;width:130px;border:1px solid #dde4f5;border-radius:8px;padding:8px;background:#f8faff;font-size:10px}
.summary div{display:flex;justify-content:space-between;margin-top:3px}
.summary b{color:#0b1f6b}
.stack{display:grid;gap:8px;margin-right:150px}

/* tips + final */
.tips{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:6px}
.tip-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.tip-card .n{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:10px}
.tip-card h3{font-size:16px;margin-bottom:4px}
.tip-card p{font-size:14px;color:var(--muted)}
.safe{margin-top:16px;background:var(--orange-soft);border-inline-start:4px solid var(--orange);border-radius:12px;padding:14px 18px;font-size:14.5px}
.final{margin-top:48px;background:linear-gradient(135deg,var(--navy-2),var(--blue));color:#fff;border-radius:24px;padding:36px;position:relative;overflow:hidden}
.final h2{font-size:clamp(24px,3.4vw,36px);margin-bottom:8px}
.final p{color:#c9d4ff;margin-bottom:20px}
.final .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.final .box{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:16px}
.final .box small{color:#ffc79e;font-weight:600}
.final .box h4{font-size:17px;margin:2px 0}
.final .box p{font-size:14px;margin:0;color:#d5defc}
.risk{margin-top:20px;font-size:12px;color:#aebcf0}
footer{max-width:1200px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:13px;text-align:center}

@media (max-width:1000px){
  .wrap{grid-template-columns:1fr}
  .rail{display:none}
  .hero-in{grid-template-columns:1fr}
  .stages{grid-template-columns:repeat(2,1fr)}
  .step-body{grid-template-columns:1fr}
  .tips{grid-template-columns:repeat(2,1fr)}
}
.wrap>main,.step-body>*{min-width:0}
html,body{overflow-x:hidden}
@media (max-width:560px){
  .mockwrap .row{flex-direction:column}
  .stages{grid-template-columns:1fr}
  .tips,.final .two{grid-template-columns:1fr}
  .step{padding:18px}
  .step-top{flex-wrap:wrap}
  .stack{margin-right:0}
  .summary{position:static;width:auto;margin-bottom:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{.topbar,.rail,.done-btn{display:none}.wrap{display:block}.step{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">TMGM<small>TRADE THE WORLD</small></div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="Language">
      <button id="btn-en" aria-pressed="true" data-lang="en">EN</button>
      <button id="btn-ar" aria-pressed="false" data-lang="ar">عربي</button>
    </div>
    <button class="icon-btn" id="theme" aria-label="Toggle theme">◐</button>
  </div>
  <div class="progress-mini"><i id="bar"></i></div>
</header>

<section class="hero">
  <div class="hero-in">
    <div>
      <h1 data-t="hero_title"></h1>
      <p class="lead" data-t="hero_sub"></p>
      <div class="pills">
        <span class="pill" data-t="pill1"></span>
        <span class="pill" data-t="pill2"></span>
        <span class="pill" data-t="pill3"></span>
      </div>
      <a class="btn" href="#step-1" data-t="start"></a>
    </div>
    <div class="hero-card">
      <h3 data-t="ready_title"></h3>
      <ul class="ready" id="ready"></ul>
    </div>
  </div>
</section>

<div class="wrap">
  <aside class="rail" id="rail" aria-label="Steps"></aside>
  <main>
    <h2 style="font-size:24px;margin-bottom:6px" data-t="journey"></h2>
    <p style="color:var(--muted);margin-bottom:18px" data-t="journey_sub"></p>
    <div class="stages" id="stages"></div>

    <div id="flow"></div>

    <div class="stage-head"><div class="n">!</div><h2 data-t="tips_title"></h2><div class="line"></div></div>
    <p style="color:var(--muted);margin-bottom:14px" data-t="tips_sub"></p>
    <div class="tips" id="tips"></div>
    <div class="safe" data-t="safe" id="safe"></div>

    <section class="final">
      <h2 data-t="final_title"></h2>
      <p data-t="final_sub"></p>
      <div class="two">
        <div class="box"><small data-t="next_guide"></small><h4 data-t="deposit_title"></h4><p data-t="deposit_sub"></p></div>
        <div class="box"><small data-t="need_help"></small><h4 data-t="chat_title"></h4><p data-t="chat_sub"></p></div>
      </div>
      <p class="risk" data-t="risk"></p>
    </section>
  </main>
</div>
<footer data-t="footer"></footer>

/* ---------- RENDER ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let lang="en"; const done=new Set();
try{ (JSON.parse(localStorage.getItem("tmgm_done")||"[]")).forEach(n=>done.add(n)); }catch(e){}
const save=()=>{try{localStorage.setItem("tmgm_done",JSON.stringify([...done]))}catch(e){}};
const nf=n=>lang==="ar"?String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]):String(n);
const stageRange=i=>{const ids=STEPS.filter(s=>s.stage===i).map(s=>s.id);return ids.length>1?`${nf(ids[0])} – ${nf(ids[ids.length-1])}`:nf(ids[0]);};

function render(){
  const L=T[lang];
  document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.title=lang==="ar"?"TMGM · مسار فتح الحساب":"TMGM · Account Opening Flow";
  $("#btn-en").setAttribute("aria-pressed",lang==="en"); $("#btn-ar").setAttribute("aria-pressed",lang==="ar");
  $$("[data-t]").forEach(el=>{const v=L[el.dataset.t]; if(v!==undefined) el.innerHTML=v;});
  $("#ready").innerHTML=L.ready.map(x=>`<li>${x}</li>`).join("");
  $("#tips").innerHTML=L.tips.map((t,i)=>`<div class="tip-card"><div class="n">${nf(i+1)}</div><h3>${t[0]}</h3><p>${t[1]}</p></div>`).join("");

  $("#stages").innerHTML=L.stagesList.map((s,i)=>`<a class="stage-card" href="#stage-${i+1}"><div class="n">${nf(i+1)}</div><h3>${s[0]}</h3><p>${s[1]}</p><span class="rng">${stageRange(i)>"" && (STEPS.filter(x=>x.stage===i).length>1?L.stepsWord:L.stepWord)} ${stageRange(i)}</span></a>`).join("");

  $("#rail").innerHTML=`<h4>${lang==="ar"?"الخطوات":"Steps"}</h4>`+L.stagesList.map((s,i)=>`<div class="stage-group"><div class="stage-label"><b>${nf(i+1)}</b>${s[0]}</div>${STEPS.filter(x=>x.stage===i).map(x=>`<a class="step-link ${done.has(x.id)?"done":""}" href="#step-${x.id}" data-id="${x.id}"><span class="num">${nf(x.id)}</span>${x.t[lang]}</a>`).join("")}</div>`).join("");

  let html="",cur=-1;
  STEPS.forEach(s=>{
    if(s.stage!==cur){cur=s.stage;html+=`<div class="stage-head" id="stage-${cur+1}"><div class="n">${nf(cur+1)}</div><h2>${L.stagesList[cur][0]}</h2><div class="line"></div></div>`;}
    const isDone=done.has(s.id);
    html+=`<article class="step" id="step-${s.id}" data-id="${s.id}">
      <div class="step-top"><div class="badge"><small>${L.step}</small><b>${nf(s.id)}</b></div><h3>${s.t[lang]}</h3>
      <button class="done-btn" aria-pressed="${isDone}" data-done="${s.id}">${isDone?"✓ "+L.marked:"○ "+L.mark}</button></div>
      <div class="step-body"><div><ul class="points">${s.pts.map((p,i)=>`<li data-p="${i+1}"><span class="dot">${nf(i+1)}</span><span>${p[lang]}</span></li>`).join("")}</ul>
      ${s.note?`<div class="note ${s.note.k}">${s.note[lang]}</div>`:""}</div>
      <div class="mockwrap">${MOCKS[s.mock]()}</div></div></article>`;
  });
  $("#flow").innerHTML=html;
  // Arabic numerals inside hotspot tags
  if(lang==="ar") $$(".hs>.tag").forEach(t=>t.textContent=nf(t.textContent));
  bindStep(); updateProgress(); spy();
}

function bindStep(){
  $$(".step").forEach(card=>{
    const hl=(p,on)=>{card.querySelectorAll(`[data-p="${p}"]`).forEach(e=>e.classList.toggle("hl",on));};
    card.querySelectorAll(".points li").forEach(li=>{
      li.addEventListener("mouseenter",()=>hl(li.dataset.p,true));
      li.addEventListener("mouseleave",()=>hl(li.dataset.p,false));
    });
    card.querySelectorAll(".hs").forEach(h=>{
      h.addEventListener("mouseenter",()=>hl(h.dataset.p,true));
      h.addEventListener("mouseleave",()=>hl(h.dataset.p,false));
    });
  });
  $$("[data-done]").forEach(b=>b.addEventListener("click",()=>{
    const id=+b.dataset.done; done.has(id)?done.delete(id):done.add(id); save(); render();
    const el=document.getElementById("step-"+id); if(el) el.scrollIntoView({block:"center"});
  }));
}
function updateProgress(){
  $("#bar").style.width=(done.size/STEPS.length*100)+"%";
}
function spy(){
  const links=$$(".step-link");
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){ links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.dataset.id)); } });
  },{rootMargin:"-30% 0px -60% 0px"});
  $$(".step").forEach(s=>io.observe(s));
}

/* ---------- LANGUAGE + DEEP LINKS ----------
   #en / #ar               → language
   #step-4-ar, #stage-2-en → jump to step/stage in that language                       */
function parseHash(){
  const h=location.hash.replace("#","");
  const m=h.match(/^(?:(step|stage)-(\d+))?-?(en|ar)?$/);
  let l=null,target=null;
  if(m){ l=m[3]||null; if(m[1]) target=`${m[1]}-${m[2]}`; }
  return {l,target};
}
function setLang(l,{updateHash=true}={}){
  lang=l; render();
  try{localStorage.setItem("tmgm_lang",l)}catch(e){}
  if(updateHash){const {target}=parseHash(); history.replaceState(null,"",`#${target?target+"-":""}${l}`);}
}
$("#btn-en").onclick=()=>setLang("en");
$("#btn-ar").onclick=()=>setLang("ar");
$("#theme").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"light":"dark";try{localStorage.setItem("tmgm_theme",r.dataset.theme)}catch(e){}};
function go(target){
  if(!target) return; const el=document.getElementById(target); if(!el) return;
  el.scrollIntoView({behavior:"smooth",block:"start"});
  if(target.startsWith("step")){el.classList.add("focus");setTimeout(()=>el.classList.remove("focus"),2200);}
}
window.addEventListener("hashchange",()=>{
  const {l,target}=parseHash();
  if(l&&l!==lang){lang=l;render();}
  go(target);
});
document.addEventListener("click",e=>{
  const a=e.target.closest('a[href^="#"]'); if(!a) return;
  const id=a.getAttribute("href").slice(1); if(!id||/-(en|ar)$/.test(id)) return;
  e.preventDefault(); history.replaceState(null,"",`#${id}-${lang}`); go(id);
});

/* init */
(function(){
  let th=null; try{th=localStorage.getItem("tmgm_theme")}catch(e){}
  if(!th&&matchMedia("(prefers-color-scheme: dark)").matches) th="dark";
  if(th) document.documentElement.dataset.theme=th;
  const {l,target}=parseHash();
  let saved=null; try{saved=localStorage.getItem("tmgm_lang")}catch(e){}
  lang=l||saved||((navigator.language||"").startsWith("ar")?"ar":"en");
  render();
  if(target) setTimeout(()=>go(target),250);
})();
</script>
